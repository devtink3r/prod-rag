[project]
name = "prod-rag"
version = "0.1.0"
description = "Enterprise RAG: Docling + LlamaIndex + BGE-M3 + Qdrant + OpenRouter"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "docling>=2.40",
    "ftfy>=6.3",
    "httpx>=0.27",
    "FlagEmbedding>=1.3",
    "qdrant-client>=1.12",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
# install exactly one: uv sync --extra cpu   |   uv sync --extra gpu
cpu = ["torch>=2.4", "torchvision"]
gpu = ["torch>=2.4", "torchvision"]

[project.scripts]
rag = "rag.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# cpu extra -> lightweight CPU wheels; gpu extra -> default PyPI (CUDA-bundled)
torch = [{ index = "pytorch-cpu", extra = "cpu" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]
