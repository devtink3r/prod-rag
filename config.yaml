# All tunables live here. Secrets live in .env (never here).

device: auto   # auto | cuda | cpu — parsing, embedding, reranking (UI can switch at runtime)

paths:
  source_dir: data/docs          # documents to ingest
  cache_dir: .cache              # parse/transform cache

ingestion:
  include_patterns: ["**/*.pdf", "**/*.docx", "**/*.pptx", "**/*.xlsx", "**/*.html", "**/*.md"]
  workers: 2                     # parallel doc processing (Docling is CPU-bound)
  pipeline_version: 1            # bump to force full re-index

cleaning:
  boilerplate_page_frequency: 0.6   # line on >60% of pages = header/footer
  min_doc_words: 50
  near_duplicate_threshold: 0.9     # MinHash jaccard

chunking:
  target_tokens: 512
  max_tokens: 1024
  min_tokens: 100                # merge chunks below this
  forced_split_overlap: 50
  parent_tokens: 2048
  contextual_summaries: true     # LLM-written chunk context (Anthropic-style)

embedding:
  model: BAAI/bge-m3             # dense + sparse in one pass
  batch_size: 16                 # per-device: x4 automatically on CUDA
  max_length: 1024   # chunks are <=1024 tok by design; 8192 padding made CPU embedding ~10x slower

vector_store:
  collection: rag_chunks
  url: http://localhost:6333

registry:
  # Postgres for doc registry + chat sessions. DSN in .env (RAG_POSTGRES_DSN).
  schema: rag

retrieval:
  fused_top_k: 15                # hybrid candidates before rerank (was 30; halves CPU rerank cost)
  rerank_top_n: 8
  reranker_model: BAAI/bge-reranker-v2-m3
  rerank_max_length: 512         # tokens per query+chunk pair at rerank (truncates long chunks)
  rerank_quantize: false         # int8 measured at only 1.27x here with slight MRR cost + deprecated torch API
  rerank_score_floor: 0.15       # below this -> "no relevant docs" path
  context_token_budget: 10000

llm:
  # via OpenRouter (key in .env: RAG_OPENROUTER_API_KEY)
  # stealth/ox-alpha: free preview model (note: stealth models may log prompts
  # and can disappear without notice; fine for public docs, swap for production)
  answer_model: stealth/ox-alpha
  utility_model: stealth/ox-alpha
  temperature: 0.1
  max_tokens: 2048
  reasoning_effort: low   # ox-alpha defaults to max-effort thinking (minutes); low is plenty for grounded QA

api:
  host: 0.0.0.0
  port: 8000
