services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5433:5432"   # 5433 to avoid clashing with your existing pgvector container
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    restart: unless-stopped

# Langfuse (observability) gets added in phase 7.
# To use your existing Postgres instead, remove the postgres service
# and point RAG_POSTGRES_DSN in .env at it.
